name: Build
on:
  push:
    branches: [ "desktop" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "desktop" ]
env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: x64
            triplet: x64-windows-static-md
          - os: windows-latest
            arch: x86
            triplet: x86-windows-static-md
          - os: ubuntu-latest
            arch: x64
            triplet: x64-linux
    runs-on: ${{ matrix.os }}
    steps:
    # Checkout repo with full history (needed for tags & SHA)
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        submodules: recursive

    # ── Linux system dependencies ──────────────────────────────────────────
    - name: Install Linux system dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwxgtk3.2-dev \
          libopenal-dev libglew-dev libgl1-mesa-dev \
          libglu1-mesa-dev libx11-dev \
          libpng-dev zlib1g-dev libminizip-dev \
          libtinyxml2-dev libfmt-dev \
          cmake ninja-build

    # ── vcpkg (Windows only) ───────────────────────────────────────────────
    - name: Setup vcpkg and install dependencies
      if: runner.os == 'Windows'
      uses: lukka/run-vcpkg@v11
      with:
        runVcpkgInstall: true
        vcpkgDirectory: vcpkg
        vcpkgJsonGlob: 'build/vcpkg.json'
      env:
        VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}

    # ── Configure ──────────────────────────────────────────────────────────
    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        cmake -S build/cmake -B build/cmake/build-${{ matrix.arch }} `
          -A ${{ matrix.arch == 'x86' && 'Win32' || 'x64' }} `
          -DCMAKE_MSVC_RUNTIME_LIBRARY="MultiThreadedDLL" `
          -DCMAKE_BUILD_TYPE=Release `
          -DUSE_STATIC_LIBS_WITH_DLL_CRT=ON `
          -DCMAKE_PREFIX_PATH="$env:VCPKG_INSTALLED_DIR/${{ matrix.triplet }}"

    - name: Configure CMake (Linux)
      if: runner.os == 'Linux'
      run: |
        cmake -S build/cmake -B build/cmake/build-${{ matrix.arch }} \
          -DCMAKE_BUILD_TYPE=Release \
          -DUSE_SYS_LIBS=ON \
          -DUSE_WX_WIDGETS=ON

    # ── Build ──────────────────────────────────────────────────────────────
    - name: Build project
      run: cmake --build build/cmake/build-${{ matrix.arch }} --config Release --parallel

    # ── Collect artifacts ──────────────────────────────────────────────────
    - name: Prepare artifact directory (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        mkdir artifact-${{ matrix.arch }}
        Get-ChildItem -Recurse -Filter unreal_speccy_portable.exe build/cmake/build-${{ matrix.arch }} | Select-Object -First 1 | Copy-Item -Destination artifact-${{ matrix.arch }}/
        Copy-Item -Recurse res artifact-${{ matrix.arch }}/res

    - name: Prepare artifact directory (Linux)
      if: runner.os == 'Linux'
      run: |
        mkdir -p artifact-linux-${{ matrix.arch }}
        cp build/cmake/build-${{ matrix.arch }}/unreal_speccy_portable artifact-linux-${{ matrix.arch }}/
        cp -r res artifact-linux-${{ matrix.arch }}/res

    - name: Upload build artifact (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v5
      with:
        name: UnrealSpeccyDesktop-${{ matrix.arch }}
        path: artifact-${{ matrix.arch }}/*

    - name: Upload build artifact (Linux)
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v5
      with:
        name: UnrealSpeccyDesktop-linux-${{ matrix.arch }}
        path: artifact-linux-${{ matrix.arch }}/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download x64 artifact
        uses: actions/download-artifact@v5
        with:
          name: UnrealSpeccyDesktop-x64
          path: release/x64

      - name: Download x86 artifact
        uses: actions/download-artifact@v5
        with:
          name: UnrealSpeccyDesktop-x86
          path: release/x86

      - name: Add root res folder to both builds
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force res release/x64/res
          Copy-Item -Recurse -Force res release/x86/res

      - name: Create ZIP archives
        shell: pwsh
        run: |
          Compress-Archive release/x64/* UnrealSpeccyDesktop-x64.zip
          Compress-Archive release/x86/* UnrealSpeccyDesktop-x86.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            UnrealSpeccyDesktop-x64.zip
            UnrealSpeccyDesktop-x86.zip
          name: "Windows Static Build (x64 + x86, static-md)"
          body: |
            Automated Windows static-md build
            Includes:
            - x64
            - x86
            Release is pinned to tag commit SHA: `${{ github.sha }}`
          target_commitish: ${{ github.sha }}
