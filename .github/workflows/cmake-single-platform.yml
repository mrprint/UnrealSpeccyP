name: Windows Static Build (vcpkg static-md)

on:
  push:
    branches: [ "desktop" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "desktop" ]

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed

jobs:
  build:
    strategy:
      matrix:
        arch: [x64, x86]
        include:
          - arch: x64
            triplet: x64-windows-static-md
            crt: MultiThreadedDLL
          - arch: x86
            triplet: x86-windows-static-md
            crt: MultiThreadedDLL

    runs-on: windows-latest

    steps:
    # Checkout repo with full history (needed for tags & SHA)
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    # Run vcpkg to install dependencies from vcpkg.json
    - name: Setup vcpkg and install dependencies
      uses: lukka/run-vcpkg@v11
      with:
        runVcpkgInstall: true
        vcpkgDirectory: vcpkg
        vcpkgJsonGlob: 'build/vcpkg.json'
      env:
        VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}

    # Configure CMake with vcpkg toolchain and static-md CRT
    - name: Configure CMake
      shell: pwsh
      run: |
        cmake -S build/cmake -B build/cmake/build-${{ matrix.arch }} `
          -A ${{ matrix.arch == 'x86' && 'Win32' || 'x64' }} `
          -DCMAKE_MSVC_RUNTIME_LIBRARY="MultiThreadedDLL" `
          -DCMAKE_BUILD_TYPE=Release `
          -DUSE_STATIC_LIBS_WITH_DLL_CRT=ON `
          -DCMAKE_PREFIX_PATH="$env:VCPKG_INSTALLED_DIR/${{ matrix.triplet }}"

    # Build the project
    - name: Build project
      shell: pwsh
      run: cmake --build build/cmake/build-${{ matrix.arch }} --config Release --parallel

    # Collect output EXE and resources into artifact directory (no ZIP yet)
    - name: Prepare artifact directory
      shell: pwsh
      run: |
        mkdir artifact-${{ matrix.arch }}
        Get-ChildItem -Recurse -Filter unreal_speccy_portable.exe build/cmake/build-${{ matrix.arch }} | Select-Object -First 1 | Copy-Item -Destination artifact-${{ matrix.arch }}/
        Copy-Item -Recurse res artifact-${{ matrix.arch }}/res

    # Upload artifact directory (not a ZIP—add Compress-Archive if ZIP is intended)
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: UnrealSpeccyDesktop-${{ matrix.arch }}
        path: |
          artifact-${{ matrix.arch }}/*

    # Create GitHub Release for tagged builds (only runs on tags)
    - name: Create GitHub Release for tagged build
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifact-${{ matrix.arch }}/*
        name: "Windows Static Build (${{ matrix.arch }}, static-md)"
        body: |
          Automated Windows static-md build
          Release is pinned to tag commit SHA: `${{ github.sha }}`
        target_commitish: ${{ github.sha }}
