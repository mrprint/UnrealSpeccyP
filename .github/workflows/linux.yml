name: Linux

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  deb-ubuntu:
    name: Deb (${{ matrix.runner }}) SDL2 GLESv2 curl
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 100
          fetch-tags: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential debhelper devscripts cmake pkg-config \
            libsdl2-dev libcurl4-openssl-dev zlib1g-dev libpng-dev \
            rsync

      - name: Build .deb
        run: |
          chmod +x build/install/linux/make_deb.sh
          OUTPUT_DIR="${GITHUB_WORKSPACE}/artifacts" \
            ./build/install/linux/make_deb.sh

      - name: Upload .deb
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.runner }}
          path: artifacts/*.deb
          if-no-files-found: warn
          archive: false

  deb-ubuntu-wx:
    name: Deb (${{ matrix.runner }}) wxWidgets OpenAL GLEW
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 100
          fetch-tags: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential debhelper devscripts cmake pkg-config \
            libwxgtk3.2-dev libopenal-dev libglew-dev \
            libgl1-mesa-dev libglu1-mesa-dev libx11-dev \
            libsdl2-dev zlib1g-dev libpng-dev libminizip-dev \
            libtinyxml2-dev rsync

      - name: Build .deb
        run: |
          chmod +x build/install/linux-wx/make_deb.sh
          OUTPUT_DIR="${GITHUB_WORKSPACE}/artifacts" \
            ./build/install/linux-wx/make_deb.sh

      - name: Upload .deb
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.runner }}-wx
          path: artifacts/*.deb
          if-no-files-found: warn
          archive: false

  rpm-fedora:
    name: RPM (Fedora ${{ matrix.arch }}) SDL2 GLESv2 curl
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    container:
      image: fedora:latest
    steps:
      - name: Install git
        run: dnf install -y git

      - uses: actions/checkout@v7
        with:
          fetch-depth: 100
          fetch-tags: true

      - id: ver
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          v=$(git describe --tags --always --dirty="-dev" 2>/dev/null || echo "unknown")
          echo "version=${v#v}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          dnf install -y \
            rpm-build rpmdevtools cmake gcc-c++ make \
            SDL2-devel libcurl-devel zlib-devel libpng-devel \
            desktop-file-utils shared-mime-info libappstream-glib \
            rsync findutils

      - name: Build .rpm
        run: |
          chmod +x build/install/fedora/make_rpm.sh
          export RPMBUILD_DIR="${GITHUB_WORKSPACE}/rpmbuild"
          export OUTPUT_DIR="${GITHUB_WORKSPACE}/artifacts"
          mkdir -p "$RPMBUILD_DIR"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          mkdir -p "$OUTPUT_DIR"
          ./build/install/fedora/make_rpm.sh

      - name: Upload .rpm
        uses: actions/upload-artifact@v7
        with:
          name: rpm-${{ matrix.arch }}
          path: artifacts/unreal-speccy-portable-0*.${{ matrix.arch }}.rpm
          if-no-files-found: warn
          archive: false

      - name: Upload debug .rpms
        uses: actions/upload-artifact@v6
        with:
          name: unreal-speccy-portable-${{ steps.ver.outputs.version }}-rpm-all-${{ matrix.arch }}.zip
          path: artifacts/*.rpm
          if-no-files-found: warn

  rpm-fedora-wx:
    name: RPM (Fedora ${{ matrix.arch }}) wxWidgets OpenAL GLEW
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    container:
      image: fedora:latest
    steps:
      - name: Install git
        run: dnf install -y git

      - uses: actions/checkout@v7
        with:
          fetch-depth: 100
          fetch-tags: true

      - id: ver
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          v=$(git describe --tags --always --dirty="-dev" 2>/dev/null || echo "unknown")
          echo "version=${v#v}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          dnf install -y \
            rpm-build rpmdevtools cmake gcc-c++ make \
            wxGTK-devel openal-soft-devel glew-devel \
            mesa-libGL-devel mesa-libGLU-devel libX11-devel \
            SDL2-devel zlib-devel libpng-devel \
            minizip-ng-compat-devel tinyxml2-devel \
            desktop-file-utils shared-mime-info libappstream-glib \
            rsync findutils

      - name: Build .rpm
        run: |
          chmod +x build/install/fedora-wx/make_rpm.sh
          export RPMBUILD_DIR="${GITHUB_WORKSPACE}/rpmbuild"
          export OUTPUT_DIR="${GITHUB_WORKSPACE}/artifacts"
          mkdir -p "$RPMBUILD_DIR"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          mkdir -p "$OUTPUT_DIR"
          ./build/install/fedora-wx/make_rpm.sh

      - name: Upload .rpm
        uses: actions/upload-artifact@v7
        with:
          name: rpm-${{ matrix.arch }}-wx
          path: artifacts/unreal-speccy-portable-wx-0*.${{ matrix.arch }}.rpm
          if-no-files-found: warn
          archive: false

      - name: Upload debug .rpms
        uses: actions/upload-artifact@v6
        with:
          name: unreal-speccy-portable-wx-${{ steps.ver.outputs.version }}-rpm-all-${{ matrix.arch }}.zip
          path: artifacts/*.rpm
          if-no-files-found: warn

  deb-ubuntu-sdl2-desktop:
    name: Deb (${{ matrix.runner }}) SDL2 desktop OpenGL Dear ImGui
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 100
          fetch-tags: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential debhelper devscripts cmake pkg-config \
            libsdl2-dev libglew-dev \
            libgl1-mesa-dev libglu1-mesa-dev libx11-dev \
            zlib1g-dev libpng-dev libminizip-dev \
            libtinyxml2-dev rsync

      - name: Build .deb
        run: |
          chmod +x build/install/linux-sdl2-desktop/make_deb.sh
          OUTPUT_DIR="${GITHUB_WORKSPACE}/artifacts" \
            ./build/install/linux-sdl2-desktop/make_deb.sh

      - name: Upload .deb
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.runner }}-sdl2-desktop
          path: artifacts/*.deb
          if-no-files-found: warn
          archive: false

  rpm-fedora-sdl2-desktop:
    name: RPM (Fedora ${{ matrix.arch }}) SDL2 desktop OpenGL Dear ImGui
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    container:
      image: fedora:latest
    steps:
      - name: Install git
        run: dnf install -y git

      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 100
          fetch-tags: true

      - id: ver
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          v=$(git describe --tags --always --dirty="-dev" 2>/dev/null || echo "unknown")
          echo "version=${v#v}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          dnf install -y \
            rpm-build rpmdevtools cmake gcc-c++ make \
            SDL2-devel glew-devel \
            mesa-libGL-devel libX11-devel \
            zlib-devel libpng-devel \
            minizip-ng-compat-devel tinyxml2-devel \
            desktop-file-utils shared-mime-info libappstream-glib \
            rsync findutils

      - name: Build .rpm
        run: |
          chmod +x build/install/fedora-sdl2-desktop/make_rpm.sh
          export RPMBUILD_DIR="${GITHUB_WORKSPACE}/rpmbuild"
          export OUTPUT_DIR="${GITHUB_WORKSPACE}/artifacts"
          mkdir -p "$RPMBUILD_DIR"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          mkdir -p "$OUTPUT_DIR"
          ./build/install/fedora-sdl2-desktop/make_rpm.sh

      - name: Upload .rpm
        uses: actions/upload-artifact@v7
        with:
          name: rpm-${{ matrix.arch }}-sdl2-desktop
          path: artifacts/unreal-speccy-portable-sdl2-desktop-0*.${{ matrix.arch }}.rpm
          if-no-files-found: warn
          archive: false

      - name: Upload debug .rpms
        uses: actions/upload-artifact@v6
        with:
          name: unreal-speccy-portable-sdl2-desktop-${{ steps.ver.outputs.version }}-rpm-all-${{ matrix.arch }}.zip
          path: artifacts/*.rpm
          if-no-files-found: warn
